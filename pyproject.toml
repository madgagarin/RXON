[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rxon"
dynamic = ["version"]
description = "RXON (Reverse Axon) - Lightweight Inter-node Reverse Communication Protocol"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Dmitrii Gagarin", email = "madgagarin@gmail.com"},
]
license = "MPL-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.0",
    "orjson>=3.11.0",
    "msgspec>=0.18.0",
    "fastjsonschema>=2.21.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy~=2.3.0",
    "pytest~=9.1.0",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "ruff",
    "mutmut>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/madgagarin/rxon"
Repository = "https://github.com/madgagarin/rxon"

[tool.setuptools.dynamic]
version = {attr = "rxon.constants.PROTOCOL_VERSION"}

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "A", "SIM", "C4", "PLC", "UP", "TID"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["input", "id"]

[tool.ruff.lint.isort]
known-first-party = ["rxon"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "conftest"
]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mutants", ".mutmut-cache", ".venv", "build", "dist"]
pythonpath = "src"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mutmut]
source_paths = ["src/rxon"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "--no-header", "--tb=no", "--ignore=mutants"]
mutate_only_covered_lines = true
use_git_change_detection = true
